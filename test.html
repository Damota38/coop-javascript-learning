<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>😎 Dédé Factory – Live Coding JS</title>
    <!-- 1. Bootstrap CSS (CDN) -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-LN+7fdVzj6u52u30Kp6M/trliBMCMKTyK833zpbD+pXdCLuTusPj697FH4R/5mcr" crossorigin="anonymous">
    <!-- 2. Google Font : Roboto -->
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet">
    <!-- 3. Feuille de styles globale -->
    <link rel="stylesheet" href="style.css">
    <script>
        function showalerts() {
            alert("Welcome sur la page test");
            alert("Ici on test du JS");
            alert("Une autre pop-up pour faire chier");
            alert("C'est chiant hein ?");
            alert("Allez la dernière");
        }
    </script>
</head>

<body>
    <script>alert("Page de test JS");</script>
    <!-- NAVBAR : en-tête de navigation responsive -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-purple mb-4">
        <div class="container">
            <!-- Logo / Brand -->
            <a class="navbar-brand" href="index.html">😎 Dédé Factory</a>
            <!-- Bouton burger pour écrans réduits -->
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav"
                aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <!-- Liens de navigation -->
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link" href="index.html">Accueil</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="tutoriels.html">Jeux & Exercices</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="references.html">Références</a>
                    </li>
                    <li>
                        <a class="nav-link active" href="test.html">Test</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- HERO : section d’introduction pleine largeur -->
    <header class="container-fluid px-4 mb-5">
        <div class="hero text-center p-5 rounded bg-purple-dark text-white">
            <!-- Titre principal -->
            <h1 class="display-5 mb-3">😎 Dédé Factory</h1>
            <!-- Sous-titre / description -->
            <p class="lead">
                Explore <code>const</code>, <code>let</code>, <code>var</code> et les fonctions dans un univers magique
                !
            </p>
        </div>
    </header>

    <div class="card h-100 shadow-sm">
        <!-- En-tête de la carte -->
        <div class="card-header">Exercice</div>
        <div class="card-body">
            <!-- Objectif affiché -->
            <p><strong>Objectif :</strong> Faire un calcul.</p>
            <!-- Énoncé détaillé -->
            <p><strong>Problème :</strong><br>
                1+1 = ?
            </p>
            <!-- Zone de saisie de la réponse -->
            <div class="mb-3">
                <label for="answer1" class="form-label">Votre réponse :</label>
                <input type="text" id="answer1" class="form-control" placeholder="...">
            </div>
            <!-- Boutons d’action -->
            <div class="d-flex gap-2">
                <button id="check1" class="btn btn-purple">Vérifier</button>
                <button id="reset1" class="btn btn-outline-danger">Relancer</button>
            </div>
            <!-- Feedback et solution -->
            <div id="feedback1" class="mt-3"></div>
            <div id="solution1" class="solution">
                1 → <code>1</code> (x visible hors du bloc)<br>
                2 → <strong>ReferenceError</strong> (y non défini hors du bloc)
            </div>
        </div>
    </div>
    <button onclick="showalerts()">Afficher des pop-ups</button>
    <script src="scripts/test.js"></script>
</body>

</html>
